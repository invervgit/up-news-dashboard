<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>India & UP News Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="app-header">
        <div class="header-content">
            <h1>News<span>Dashboard</span></h1>
            <p id="last-updated">Updating...</p>
        </div>
        
        <div class="view-switcher">
            <button id="btn-national" class="switch-btn active" onclick="setView('national')">
                🇮🇳 India (National)
            </button>
            <button id="btn-state" class="switch-btn" onclick="setView('state')">
                🏛️ UP Focus (Top 50)
            </button>
        </div>
    </header>

    <section id="filter-section" class="filters hidden">
        <div class="filter-wrapper">
            <label>Filter District:</label>
            <select id="district-select">
                <option value="All">All Districts</option>
                </select>
        </div>
        <div class="filter-wrapper">
            <label>Category:</label>
            <select id="category-select">
                <option value="All">All Categories</option>
                <option value="Governance">Governance & Dev</option>
                <option value="Opposition">Opposition Activity</option>
                <option value="Government">Govt Decisions</option>
                <option value="Judicial">Courts & Legal</option>
            </select>
        </div>
    </section>

    <main class="container">
        <div id="news-grid" class="grid">
            <div class="loader">Fetching latest news...</div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
