<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoliticalIntel: Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Political<span>Intel</span></div>
        <div class="nav-links">
            <span id="last-updated">Updating...</span>
        </div>
    </nav>

    <header class="hero">
        <h1>Intelligence Dashboard</h1>
        <p>Real-time tracking of National developments, Global events, and Uttar Pradesh governance.</p>
        
        <div class="mode-switcher">
            <button class="mode-btn active" onclick="switchMode('national')">🇮🇳 India (National)</button>
            <button class="mode-btn" onclick="switchMode('international')">🌍 International</button>
            <button class="mode-btn" onclick="switchMode('state')">🏛️ UP Focus (Top 50)</button>
        </div>
    </header>

    <section class="controls" id="filter-bar">
        <div class="filter-group">
            <label>District:</label>
            <select id="district-filter">
                <option value="All">All Districts</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Topic:</label>
            <select id="category-filter">
                <option value="All">All Topics</option>
                <option value="Governance">Governance</option>
                <option value="Judicial">Judicial</option>
                <option value="Opposition">Opposition</option>
                <option value="Government">Government</option>
            </select>
        </div>
    </section>

    <main id="news-grid" class="grid-container">
        <div class="loader">Loading Intelligence...</div>
    </main>

    <script src="script.js"></script>
</body>
</html>
