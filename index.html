<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Executive Intelligence Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Political<span>Intel</span> <span class="badge-exec">Executive View</span></div>
        <div class="nav-actions">
            <span id="last-updated">Updating...</span>
        </div>
    </nav>

    <div class="tab-container">
        <button class="tab-btn active" onclick="switchTab('dashboard')">📊 Dashboard</button>
        <button class="tab-btn" onclick="switchTab('international')">🌍 International</button>
        <button class="tab-btn" onclick="switchTab('national')">🇮🇳 National</button>
        <button class="tab-btn" onclick="switchTab('up-focus')">🏛️ UP Focus</button>
    </div>

    <div id="date-control-panel" class="date-panel">
        <label>Report Date:</label>
        <select id="report-date-select" onchange="renderDashboard()">
            </select>
        <span class="hint">(Showing last 7 days history)</span>
    </div>

    <main class="content-wrapper">
        
        <div id="view-dashboard" class="view-section">
            <div id="report-container">
                <div class="loader">Generating Daily Briefing...</div>
            </div>
        </div>

        <div id="view-grid" class="view-section hidden">
            <div id="grid-filters" class="controls hidden">
                <select id="district-filter"><option value="All">All Districts</option></select>
            </div>
            <div id="news-grid" class="grid-container">
                </div>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
