<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UP Political Intelligence Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="logo">Political<span>Intel</span></div>
        <div class="nav-links">
            <span id="last-updated">Updating...</span>
        </div>
    </nav>

    <header class="hero">
        <h1>Uttar Pradesh Governance & Political Tracker</h1>
        <p>Curated intelligence on policies, judicial rulings, and political movements. No clutter.</p>
        
        <div class="mode-switcher">
            <button class="mode-btn active" onclick="switchMode('national')">🇮🇳 India (National)</button>
            <button class="mode-btn" onclick="switchMode('state')">🏛️ UP Focus (Top 50)</button>
        </div>
    </header>

    <section class="controls" id="filter-bar">
        <div class="filter-group">
            <select id="district-filter">
                <option value="All">All Districts</option>
            </select>
            <select id="category-filter">
                <option value="All">All Categories</option>
                <option value="Governance & Dev">Governance & Development</option>
                <option value="Judicial">Judicial / Legal</option>
                <option value="Opposition/Political">Opposition Activity</option>
                <option value="Government/NDA">Government Announcements</option>
            </select>
        </div>
    </section>

    <main id="news-grid" class="grid-container">
        <div class="loader">Loading Intelligence...</div>
    </main>

    <script src="script.js"></script>
</body>
</html>
