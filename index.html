<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PoliticalIntel: Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

    <nav class="navbar">
        <div class="logo">Political<span>Intel</span></div>
        <div class="nav-links">
            <span id="last-updated">Updating...</span>
        </div>
    </nav>

    <header class="hero">
        <h1>Intelligence Dashboard</h1>
        <p>Real-time tracking of developments, events, and Uttar Pradesh</p>
        
        <div class="mode-switcher">
            <button class="mode-btn active" onclick="switchMode('national')">National</button>
            <button class="mode-btn" onclick="switchMode('international')">International</button>
            <button class="mode-btn" onclick="switchMode('state')">UP Focus</button>
            <button class="mode-btn special-dash-btn" onclick="switchMode('dashboard')">📊 Executive Dashboard</button>
        </div>
    </header>

    <section class="controls" id="filter-bar">
        <div class="filter-group">
            <label>District:</label>
            <select id="district-filter">
                <option value="All">All Districts</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Topic:</label>
            <select id="category-filter">
                <option value="All">All Topics</option>
                <option value="Governance">Governance</option>
                <option value="Judicial">Judicial</option>
                <option value="Opposition">Opposition</option>
                <option value="Government">Government</option>
            </select>
        </div>
    </section>

    <section class="controls dashboard-controls" id="dashboard-bar" style="display: none;">
        <div class="filter-group">
            <label>Report Date:</label>
            <select id="report-date">
                </select>
        </div>
        <button onclick="downloadPDF()" class="pdf-btn">
            ⬇ Download Daily Report (PDF)
        </button>
    </section>

    <main>
        <div id="news-grid" class="grid-container">
            <div class="loader">Loading Intelligence...</div>
        </div>

        <div id="executive-report" class="report-container" style="display: none;">
            <div class="report-header">
                <h2>Daily Intelligence Briefing</h2>
                <p id="report-date-display">Date: ...</p>
                <hr>
            </div>
            <div id="report-content">
                </div>
            <div class="report-footer">
                <p>Generated by PoliticalIntel Dashboard • Internal Use Only</p>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
