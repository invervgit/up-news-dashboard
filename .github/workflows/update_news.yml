name: Update UP News Data

on:
  schedule:
    - cron: '30 */4 * * *' # Run every 4 hours
  workflow_dispatch:      # Allow manual run

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 lxml

    - name: Fetch and process news
      run: python fetch_news.py

    - name: Commit and push changes
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "action@github.com"
        git add data/news.json
        # Only commit if data/news.json has changed
        git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update news data" && git push)

    # --- FIX FOR TIMEOUT ERROR ---
    - name: Prepare Deployment Artifact
      run: |
        mkdir _site
        cp index.html _site/
        cp style.css _site/
        cp script.js _site/
        cp -r data _site/
        # Favicon fix if you have an image, otherwise html handles it

    - name: Setup Pages
      uses: actions/configure-pages@v3

    - name: Upload artifact
      uses: actions/upload-pages-artifact@v2
      with:
        path: '_site' # Only uploading the clean folder

    - name: Deploy to GitHub Pages
      uses: actions/deploy-pages@v2
